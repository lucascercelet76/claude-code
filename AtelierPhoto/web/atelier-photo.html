<title>Atelier Photo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Bebas+Neue&family=Pacifico&family=Playfair+Display:wght@400;700&display=swap">
<style>
/* Mise en page : appli plein écran — barre du haut, plan de travail, panneau d'outils, barre d'onglets. Thème sombre assumé (atelier de retouche). */
:root {
  --ink: #101217;
  --panel: #171a21;
  --raise: #222631;
  --line: #2f3442;
  --fg: #e8ebf2;
  --muted: #9aa1b2;
  --accent: #a3b1ff;
  --accent-ink: #141833;
  --warn: #ffbf73;
  --danger: #ff8a8a;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--ink);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
}

/* Barre du haut */
.top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.brand { flex: 1; min-width: 0; text-align: center; line-height: 1.1; }
.brand b { font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
.brand small { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ibtn {
  min-width: 40px; height: 40px; padding: 0 10px;
  display: inline-grid; place-items: center;
  border: 0; border-radius: 10px;
  background: transparent; color: var(--fg);
}
.ibtn:disabled { opacity: 0.35; }
.ibtn svg { width: 22px; height: 22px; }
.cta {
  height: 36px; padding: 0 14px; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600;
}

/* Plan de travail */
.stage {
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 40%, #1b1f29 0%, var(--ink) 70%);
}
#cv {
  touch-action: none;
  max-width: 100%;
  background-color: #d9dce3;
  background-image:
    conic-gradient(#f4f5f8 25%, #d9dce3 0 50%, #f4f5f8 0 75%, #d9dce3 0);
  background-size: 16px 16px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
}
.hint {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 6px 12px; border-radius: 999px;
  background: rgba(16, 18, 23, 0.82); border: 1px solid var(--line);
  font-size: 12px; color: var(--fg);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  pointer-events: none;
}
.toast {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 10px 14px; border-radius: 12px;
  background: var(--raise); border: 1px solid var(--line);
  font-size: 13px; text-align: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

/* Panneau d'outils */
.panel {
  height: min(36vh, 300px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding-block: 12px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  align-content: start;
  gap: 10px;
}
.panel h2 {
  margin: 0;
  font-family: var(--font-display); font-weight: 600; font-size: 15px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
}
.panel h2 small { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.note { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); max-width: 62ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.spread { justify-content: space-between; }
.btn {
  min-height: 38px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--raise); color: var(--fg);
  display: inline-flex; align-items: center; gap: 8px;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.wide { flex: 1 1 200px; justify-content: center; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tools .ibtn { background: var(--raise); border: 1px solid var(--line); }

.seg { display: flex; padding: 3px; border-radius: 11px; background: var(--raise); border: 1px solid var(--line); }
.seg button { flex: 1; min-height: 34px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.sl { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 4.6em; align-items: center; gap: 10px; font-size: 13px; }
.sl output { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 28px; }
input[type="color"] {
  width: 38px; height: 38px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--raise);
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 4px; }
input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 6px; }
select { min-height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise); }
textarea {
  width: 100%; min-height: 54px; resize: vertical; box-sizing: border-box;
  padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--raise);
  -webkit-user-select: text; user-select: text;
}
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.check input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }

/* Liste des calques */
.layers { display: grid; gap: 4px; }
.lrow {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 5px 6px; border-radius: 10px; border: 1px solid transparent;
}
.lrow.sel { background: rgba(163, 177, 255, 0.12); border-color: rgba(163, 177, 255, 0.45); }
.lrow canvas, .lrow .glyph {
  width: 40px; height: 40px; border-radius: 7px; background: var(--raise); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; color: var(--muted);
}
.lrow .lname { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .lname small { display: block; font-size: 11px; color: var(--muted); }

/* Bandes de vignettes (filtres, esquisses, formes) */
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.thumb { flex: none; width: 74px; border: 0; padding: 0; background: none; color: var(--fg); display: grid; gap: 5px; justify-items: center; }
.thumb canvas, .thumb .sq {
  width: 70px; height: 70px; border-radius: 10px; background: var(--raise);
  outline: 2px solid transparent; outline-offset: 1px;
}
.thumb.on canvas, .thumb.on .sq { outline-color: var(--accent); }
.thumb span { font-size: 11px; white-space: nowrap; }
.thumb.on span { color: var(--accent); }
.thumb .sq { display: grid; place-items: center; }
.thumb .sq svg { width: 38px; height: 38px; }
.fonts { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.fonts::-webkit-scrollbar { display: none; }
.fonts .btn { flex: none; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw.on { border-color: var(--fg); }

/* Onglets */
.tabs {
  display: flex; overflow-x: auto; scrollbar-width: none;
  background: var(--panel);
  border-top: 1px solid var(--line);
  padding-block: 4px;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 64px; min-height: 52px; border: 0; background: none; color: var(--muted);
  display: grid; justify-items: center; align-content: center; gap: 3px; font-size: 11px;
}
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }

/* Fenêtres (nouveau, recadrage, export) */
.sheet {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(6, 7, 10, 0.7);
  display: grid; align-items: end; justify-items: center;
}
.sheet .card {
  width: min(560px, 100%); max-height: 92%; overflow-y: auto; box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 18px 18px 0 0;
  padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px;
}
.card h3 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; text-wrap: balance; }
.sizes { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.sizes .btn { flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 10px 12px; min-height: 58px; }
.sizes .btn small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.export-preview { display: grid; place-items: center; }
.export-preview img {
  max-height: 46vh; max-width: 100%; border-radius: 10px;
  background-color: #d9dce3;
  background-image: conic-gradient(#f4f5f8 25%, #d9dce3 0 50%, #f4f5f8 0 75%, #d9dce3 0);
  background-size: 16px 16px;
  -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default;
}

.crop {
  position: fixed; inset: 0; z-index: 25; background: #07080b;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
}
.crop .top { background: #07080b; }
.cropstage { position: relative; display: grid; place-items: center; overflow: hidden; touch-action: none; }
.cropbox { position: relative; }
.cropbox canvas { display: block; }
.cropframe {
  position: absolute; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.58);
  border: 2px solid #fff; box-sizing: border-box; touch-action: none;
  background-image:
    linear-gradient(to right, transparent calc(33.33% - 0.5px), rgba(255,255,255,.45) 0 calc(33.33% + 0.5px), transparent 0 calc(66.66% - 0.5px), rgba(255,255,255,.45) 0 calc(66.66% + 0.5px), transparent 0),
    linear-gradient(to bottom, transparent calc(33.33% - 0.5px), rgba(255,255,255,.45) 0 calc(33.33% + 0.5px), transparent 0 calc(66.66% - 0.5px), rgba(255,255,255,.45) 0 calc(66.66% + 0.5px), transparent 0);
}
.handle { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; touch-action: none; display: grid; place-items: center; }
.handle::after { content: ""; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.5); }
.cropbar {
  display: grid; gap: 12px;
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cropbar .strip .btn { flex: none; }

@media (prefers-reduced-motion: no-preference) {
  .sheet .card { animation: rise 0.22s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: 0.4; } }
}
@media (min-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr) auto; }
  .top { grid-column: 1 / -1; }
  .stage { grid-row: 2 / 4; }
  .panel { height: auto; grid-column: 2; grid-row: 2; border-top: 0; border-left: 1px solid var(--line); }
  .tabs { grid-column: 2; grid-row: 3; border-left: 1px solid var(--line); flex-wrap: wrap; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <button class="ibtn" id="btn-new" aria-label="Nouveau projet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>
    </button>
    <button class="ibtn" id="btn-undo" aria-label="Annuler" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -6)"/></svg>
    </button>
    <button class="ibtn" id="btn-redo" aria-label="Rétablir" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 7 5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12h2" transform="translate(0 -6)"/></svg>
    </button>
    <div class="brand"><b>Atelier Photo</b><small id="doc-size">—</small></div>
    <button class="cta" id="btn-export">Exporter</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Toile de travail"></canvas>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast" hidden></div>
  </main>

  <section class="panel" id="panel" aria-live="polite"></section>
  <nav class="tabs" id="tabs" aria-label="Outils"></nav>
</div>

<input type="file" id="file-open" accept="image/*" hidden>
<input type="file" id="file-layer" accept="image/*" hidden>

<div class="sheet" id="sheet-new" hidden>
  <div class="card" role="dialog" aria-labelledby="new-title">
    <div class="row spread">
      <h3 id="new-title">Nouveau projet</h3>
      <button class="ibtn" data-close="sheet-new" aria-label="Fermer">✕</button>
    </div>
    <button class="btn primary wide" id="btn-open-photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4 4 3 3-2 4 3"/></svg>
      Ouvrir une photo (ou en prendre une)
    </button>
    <p class="note">Toile vierge&nbsp;: choisis la couleur du fond, puis le format.</p>
    <div class="row">
      <label class="check"><input type="checkbox" id="blank-transparent"> Fond transparent</label>
      <label class="check">Couleur <input type="color" id="blank-color" value="#ffffff"></label>
    </div>
    <div class="sizes" id="blank-sizes"></div>
  </div>
</div>

<div class="sheet" id="sheet-export" hidden>
  <div class="card" role="dialog" aria-labelledby="export-title">
    <div class="row spread">
      <h3 id="export-title">Exporter</h3>
      <button class="ibtn" data-close="sheet-export" aria-label="Fermer">✕</button>
    </div>
    <div class="export-preview"><img id="export-img" alt="Aperçu de l’image exportée"></div>
    <div class="seg" id="export-format">
      <button data-fmt="png" class="on">PNG · garde la transparence</button>
      <button data-fmt="jpeg">JPEG · plus léger</button>
    </div>
    <button class="btn primary wide" id="btn-save">Enregistrer l’image</button>
    <p class="note" id="export-note"></p>
  </div>
</div>

<div class="crop" id="crop" hidden>
  <header class="top">
    <button class="btn" id="crop-cancel">Annuler</button>
    <div class="brand"><b>Recadrer</b><small id="crop-size">—</small></div>
    <button class="cta" id="crop-apply">Valider</button>
  </header>
  <div class="cropstage" id="cropstage">
    <div class="cropbox" id="cropbox">
      <canvas id="cropcv"></canvas>
      <div class="cropframe" id="cropframe"></div>
      <div class="handle" data-c="tl"></div><div class="handle" data-c="tr"></div>
      <div class="handle" data-c="bl"></div><div class="handle" data-c="br"></div>
    </div>
  </div>
  <div class="cropbar">
    <div class="strip" id="crop-ratios"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="crop-left">↺ Gauche</button>
      <button class="btn" id="crop-right">↻ Droite</button>
      <button class="btn" id="crop-flip">⇋ Miroir</button>
    </div>
  </div>
</div>

(() => {
"use strict";

/* ---------- Utilitaires ---------- */
const $ = (s) => document.querySelector(s);
let uid = 0;
const tagC = (c) => { c._v = ++uid; return c; };
function mkCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return tagC(c);
}
function cloneCanvas(c) {
  const n = mkCanvas(c.width, c.height);
  n.getContext("2d").drawImage(c, 0, 0);
  return n;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const MAX_DIM = 1600;

/* ---------- Icônes ---------- */
const I = (d, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICON = {

  shapes: I('<rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/><circle cx="16" cy="16" r="4.5"/>'),
  text: I('<path d="M5 6V4h14v2M12 4v16M9 20h6"/>'),
  brush: I('<path d="M19 4c-4 2-8 6-10 10l1.5 1.5C14.5 13.5 18 9 20 5z"/><path d="M8.5 15.5C6 15 4.5 17 4.5 20c2.5 0 5-1 5.5-3"/>'),

  eyeOff: I('<path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3 3.7M6.1 6.6C3.6 8.3 2 12 2 12s4 7 10 7a9.7 9.7 0 0 0 4.4-1"/>'),
  wand: I('<path d="m4 20 11-11M14 4v3M19 9h-3M18 5l-2 2M9 4l1 2M20 14l-2-1"/>'),
  eraser: I('<path d="M8 20h12M5 15l8-8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 18H8z"/>'),
  restore: I('<path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="3.5"/>'),
};

/* ---------- État du document ---------- */
const S = {

    color: "#ffffff", font: "bebas", bold: false, shadow: true, outline: false,

/* ---------- Détourage ---------- */
function makeMask(src) {

    const sx = Math.floor(((q.x + f.w / 2) / f.w) * w), sy = Math.floor(((q.y + f.h / 2) / f.h) * h);
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) { toast("Touche une zone à l’intérieur de la photo sélectionnée."); return 0; }

    for (let y = 1; y < h - 1; y++) border.push(y * w, y * w + w - 1);
    const med = (c) => { const a = border.map((p) => d[p * 4 + c]).sort((u, v) => u - v); return a[a.length >> 1]; };

  if (qt > n * 0.97) { toast("Le fond et le sujet se ressemblent trop. Baisse la tolérance."); return 0; }

}

    insertLayer(copy);

/* ---------- Pinceau, gomme, déplacement ---------- */
const ptrs = new Map();

function srcPoint(l, p) {

cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();

  const p = docPoint(e);
  ptrs.set(e.pointerId, p);
  if (sampleHint) { sampleHint = false; syncHint(); }

    const l = sel();
    if (ptrs.size === 1) gesture = { type: "drag", p0: p, base: l && { x: l.x, y: l.y }, moved: false, undone: false };
    else if (ptrs.size === 2 && l && S.tool === "move") {
      const [a, b] = [...ptrs.values()];
      gesture = {
        type: "pinch", undone: gesture && gesture.undone,
        base: { x: l.x, y: l.y, scale: l.scale, rot: l.rot },
        d0: Math.hypot(b.x - a.x, b.y - a.y) || 1, a0: Math.atan2(b.y - a.y, b.x - a.x), m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },

cv.addEventListener("pointermove", (e) => {

    if (!gesture.moved && Math.hypot(dx, dy) * viewScale > 5) gesture.moved = true;
    if (!gesture.moved || S.tool !== "move" || !l || !gesture.base) return;
    if (!gesture.undone) { pushUndo(); gesture.undone = true; }
    l.x = gesture.base.x + dx; l.y = gesture.base.y + dy;
    requestRender();
  } else if (gesture.type === "pinch" && ptrs.size >= 2 && l) {
    const [a, b] = [...ptrs.values()];
    if (!gesture.undone) { pushUndo(); gesture.undone = true; }
    const d = Math.hypot(b.x - a.x, b.y - a.y), ang = Math.atan2(b.y - a.y, b.x - a.x), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };

const smallCache = new Map();
let thumbJob = 0;
function refreshThumbs() {
  panel.querySelectorAll("[data-lthumb]").forEach((c) => {
    const l = S.layers.find((x) => x.id === c.dataset.lthumb);
    if (!l) return;
    const b = l._out || l.src, x = c.getContext("2d"), k = Math.max(c.width / b.width, c.height / b.height);
    x.clearRect(0, 0, c.width, c.height);
    x.drawImage(b, (c.width - b.width * k) / 2, (c.height - b.height * k) / 2, b.width * k, b.height * k);
  });
  const fts = [...panel.querySelectorAll("[data-fthumb]")];
  const l = sel();
  if (!fts.length || !l || l.type !== "image") return;
  const job = ++thumbJob;
  const key0 = l.src._v + (l.mask ? "m" + l.mask._v : "");
  let base = smallCache.get("src" + key0);
  if (!base) {
    const k = 140 / Math.min(l.src.width, l.src.height);
    base = mkCanvas(l.src.width * k, l.src.height * k);
    const bx = base.getContext("2d");
    bx.drawImage(l.src, 0, 0, base.width, base.height);
    if (l.mask) { bx.globalCompositeOperation = "destination-in"; bx.drawImage(l.mask, 0, 0, base.width, base.height); }
    smallCache.set("src" + key0, base);
  }
  let i = 0;
  const step = () => {
    if (job !== thumbJob || i >= fts.length) return;
    const c = fts[i++], f = c.dataset.fthumb, key = `${key0}|${f}|${l.detail}`;
    let out = smallCache.get(key);
    if (!out) {
      out = f === "none" ? base : processImage(base, { adj: defAdj(), filter: f, intensity: 1, detail: l.detail }, 400);
      smallCache.set(key, out);
      if (smallCache.size > 80) smallCache.delete(smallCache.keys().next().value);
    }
    const x = c.getContext("2d");
    x.clearRect(0, 0, c.width, c.height);
    x.drawImage(out, (c.width - out.width) / 2, (c.height - out.height) / 2);
    setTimeout(step, 0);
  };
  setTimeout(step, 30);
}

async function loadImageFile(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const k = Math.min(1, MAX_DIM / Math.max(img.naturalWidth, img.naturalHeight));
    const c = mkCanvas(img.naturalWidth * k, img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}

  S.W = src.width; S.H = src.height;
  const l = imageLayer(src, name);

}

const CR = { src: null, mask: null, rect: null, ratio: null, box: null, layer: null, changed: false };
const RATIOS = [["Libre", null], ["Original", "orig"], ["1:1", 1], ["4:5", 4 / 5], ["4:3", 4 / 3], ["3:4", 3 / 4], ["16:9", 16 / 9], ["9:16", 9 / 16]];
$("#crop-ratios").innerHTML = RATIOS.map(([n], i) => `<button class="btn ${i ? "" : "on"}" data-r="${i}">${n}</button>`).join("");
function openCrop() {
  const l = sel();
  if (!l || l.type !== "image") { toast("Ajoute ou sélectionne un calque photo pour le recadrer."); return; }
  Object.assign(CR, { src: l.src, mask: l.mask, rect: { x: 0, y: 0, w: 1, h: 1 }, ratio: null, layer: l, changed: false });
  $("#crop-ratios").querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === 0));
  $("#crop").hidden = false;
  requestAnimationFrame(drawCrop);
}
function cropRatio() { return CR.ratio === "orig" ? CR.src.width / CR.src.height : CR.ratio; }
function maxRect(r) {
  if (!r) return { x: 0, y: 0, w: 1, h: 1 };
  const rel = r / (CR.src.width / CR.src.height);
  const w = rel >= 1 ? 1 : rel, h = rel >= 1 ? 1 / rel : 1;
  return { x: (1 - w) / 2, y: (1 - h) / 2, w, h };
}
function drawCrop() {
  const st = $("#cropstage"), aw = st.clientWidth - 40, ah = st.clientHeight - 40;
  const k = Math.min(aw / CR.src.width, ah / CR.src.height);
  const w = Math.floor(CR.src.width * k), h = Math.floor(CR.src.height * k), dpr = Math.min(devicePixelRatio || 1, 3);
  const c = $("#cropcv"); c.style.width = w + "px"; c.style.height = h + "px"; c.width = w * dpr; c.height = h * dpr;
  const x = c.getContext("2d");
  x.drawImage(CR.src, 0, 0, c.width, c.height);
  if (CR.mask) { x.globalCompositeOperation = "destination-in"; x.drawImage(CR.mask, 0, 0, c.width, c.height); x.globalCompositeOperation = "source-over"; }
  CR.box = { w, h };
  $("#cropbox").style.width = w + "px"; $("#cropbox").style.height = h + "px";
  placeFrame();
}
function placeFrame() {
  const { w, h } = CR.box, r = CR.rect, f = $("#cropframe");
  Object.assign(f.style, { left: r.x * w + "px", top: r.y * h + "px", width: r.w * w + "px", height: r.h * h + "px" });
  const pos = { tl: [r.x, r.y], tr: [r.x + r.w, r.y], bl: [r.x, r.y + r.h], br: [r.x + r.w, r.y + r.h] };
  document.querySelectorAll(".handle").forEach((hd) => { const [a, b] = pos[hd.dataset.c]; hd.style.left = a * w + "px"; hd.style.top = b * h + "px"; });
  $("#crop-size").textContent = `${Math.round(r.w * CR.src.width)} × ${Math.round(r.h * CR.src.height)} px`;
}
let cdrag = null;
function cropDown(e, corner) {
  e.preventDefault(); e.stopPropagation();
  e.currentTarget.setPointerCapture(e.pointerId);
  cdrag = { corner, sx: e.clientX, sy: e.clientY, start: { ...CR.rect } };
}
$("#cropframe").addEventListener("pointerdown", (e) => cropDown(e, null));
document.querySelectorAll(".handle").forEach((hd) => hd.addEventListener("pointerdown", (e) => cropDown(e, hd.dataset.c)));
function cropMove(e) {
  if (!cdrag) return;
  const { w: BW, h: BH } = CR.box, tx = e.clientX - cdrag.sx, ty = e.clientY - cdrag.sy;
  const s = { x: cdrag.start.x * BW, y: cdrag.start.y * BH, w: cdrag.start.w * BW, h: cdrag.start.h * BH };
  let out;
  if (!cdrag.corner) {
    out = { x: clamp(s.x + tx, 0, BW - s.w), y: clamp(s.y + ty, 0, BH - s.h), w: s.w, h: s.h };
  } else {
    const c = cdrag.corner, top = c[0] === "t", left = c[1] === "l";
    let x0 = s.x, y0 = s.y, x1 = s.x + s.w, y1 = s.y + s.h;
    if (left) x0 += tx; else x1 += tx;
    if (top) y0 += ty; else y1 += ty;
    x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(BW, x1); y1 = Math.min(BH, y1);
    let w = x1 - x0, h = y1 - y0;
    if (w < 40 || h < 40) return;
    const r = cropRatio();
    if (r) {
      h = w / r;
      if (top) { if (y1 - h < 0) { h = y1; w = h * r; } y0 = y1 - h; }
      else if (y0 + h > BH) { h = BH - y0; w = h * r; }
      if (left) x0 = x1 - w;
      if (w < 20 || h < 20) return;
    }
    out = { x: x0, y: y0, w, h };
  }
  CR.rect = { x: out.x / BW, y: out.y / BH, w: out.w / BW, h: out.h / BH };
  placeFrame();
}
document.addEventListener("pointermove", cropMove);
document.addEventListener("pointerup", () => { cdrag = null; });
$("#crop-ratios").addEventListener("click", (e) => {
  const b = e.target.closest("[data-r]");
  if (!b) return;
  CR.ratio = RATIOS[+b.dataset.r][1];
  $("#crop-ratios").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  CR.rect = maxRect(cropRatio()); placeFrame();
});
function transformCanvas(c, kind) {
  if (!c) return null;
  const rot = kind !== "flip", out = mkCanvas(rot ? c.height : c.width, rot ? c.width : c.height), x = out.getContext("2d");
  if (kind === "flip") { x.translate(c.width, 0); x.scale(-1, 1); }
  else { x.translate(out.width / 2, out.height / 2); x.rotate(kind === "right" ? Math.PI / 2 : -Math.PI / 2); x.translate(-c.width / 2, -c.height / 2); }
  x.drawImage(c, 0, 0);
  return out;
}
["left", "right", "flip"].forEach((k) => $("#crop-" + k).addEventListener("click", () => {
  CR.src = transformCanvas(CR.src, k); CR.mask = transformCanvas(CR.mask, k); CR.changed = true;
  CR.rect = maxRect(cropRatio()); drawCrop();
}));
function cropCanvas(c, r) {
  if (!c) return null;
  const x = Math.round(r.x * c.width), y = Math.round(r.y * c.height), w = Math.max(1, Math.round(r.w * c.width)), h = Math.max(1, Math.round(r.h * c.height));
  const out = mkCanvas(w, h); out.getContext("2d").drawImage(c, x, y, w, h, 0, 0, w, h);
  return out;
}
$("#crop-cancel").addEventListener("click", () => { $("#crop").hidden = true; });
$("#crop-apply").addEventListener("click", () => {
  const r = CR.rect, full = r.x < 0.001 && r.y < 0.001 && r.w > 0.999 && r.h > 0.999;
  $("#crop").hidden = true;
  if (full && !CR.changed) return;
  const l = CR.layer;
  pushUndo();
  l.src = full ? CR.src : cropCanvas(CR.src, r);
  l.mask = full ? CR.mask : cropCanvas(CR.mask, r);
  if (S.layers[0] === l) { S.W = l.src.width; S.H = l.src.height; l.x = l.y = l.rot = 0; l.scale = 1; }
  layout(); renderPanel(); requestRender();
  toast("Recadrage appliqué.");
});

/* ---------- Photo d'exemple (dessinée ici, aucune image externe) ---------- */
function sampleScene() {
  const W = 1400, H = 1050, c = mkCanvas(W, H), x = c.getContext("2d");
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const horizon = H * 0.6;
  const sky = x.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, "#1f2f57"); sky.addColorStop(0.45, "#7b6bb0"); sky.addColorStop(0.8, "#f19a6b"); sky.addColorStop(1, "#ffd08a");
  x.fillStyle = sky; x.fillRect(0, 0, W, horizon);
  const sun = x.createRadialGradient(W * 0.62, horizon - 70, 10, W * 0.62, horizon - 70, 260);
  sun.addColorStop(0, "rgba(255,240,200,1)"); sun.addColorStop(0.18, "rgba(255,214,150,0.95)"); sun.addColorStop(1, "rgba(255,180,120,0)");
  x.fillStyle = sun; x.fillRect(0, 0, W, horizon);
  const ridge = (base, amp, color, rough) => {
    x.beginPath(); x.moveTo(0, horizon);
    let y = base;
    for (let px = 0; px <= W; px += 20) { y = clamp(y + (rnd() - 0.5) * rough, base - amp, base + amp * 0.4); x.lineTo(px, y); }
    x.lineTo(W, horizon); x.closePath(); x.fillStyle = color; x.fill();
  };
  ridge(horizon - 230, 140, "#5a4f86", 70);
  ridge(horizon - 140, 90, "#3e3a6a", 55);
  ridge(horizon - 60, 50, "#26284a", 35);
  x.save();
  x.translate(0, horizon * 2); x.scale(1, -1);
  x.globalAlpha = 0.55; x.drawImage(c, 0, 0, W, horizon, 0, 0, W, horizon);
  x.restore();
  const water = x.createLinearGradient(0, horizon, 0, H);
  water.addColorStop(0, "rgba(30,36,70,0.35)"); water.addColorStop(1, "rgba(14,18,38,0.95)");
  x.fillStyle = water; x.fillRect(0, horizon, W, H - horizon);
  x.fillStyle = "rgba(255,220,170,0.5)";
  for (let i = 0; i < 26; i++) { const yy = horizon + 8 + i * i * 0.9, ww = 240 - i * 7; x.fillRect(W * 0.62 - ww / 2 + (rnd() - 0.5) * 30, yy, ww, 2); }
  x.fillStyle = "#0d1022";
  for (let t = 0; t < 14; t++) {
    const tx = 40 + t * 34 + rnd() * 20, th = 120 + rnd() * 140, tw = th * 0.32, ty = horizon + 10;
    x.beginPath(); x.moveTo(tx, ty - th); x.lineTo(tx + tw / 2, ty); x.lineTo(tx - tw / 2, ty); x.closePath(); x.fill();
  }
  x.fillRect(0, horizon + 4, 560, 18);
  return c;
}

/* ---------- Démarrage ---------- */
new ResizeObserver(() => layout()).observe(stage);
window.addEventListener("resize", () => { if (!$("#crop").hidden) drawCrop(); });
newDocument(sampleScene(), "Photo d’exemple");
sampleHint = true;
syncHint();
document.fonts && document.fonts.ready.then(requestRender);
setTimeout(getDownloads, 0);
})();
</script>
